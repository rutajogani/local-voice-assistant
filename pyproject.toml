[project]
name = "local_voice_assistant"
version = "0.1.0"
description = "Ask by voice, get a helpful reply, and hear it spoken aloud. The assistant can also tell the time, do simple calculations, and save notes."
readme = "README.md"
authors = [
    { name = "Ruta Jogani", email = "ruta007jogani@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "openai>=2.48.0",
    "psycopg2-binary>=2.9.12",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.5",
    "pydantic-ai>=0.8.1",
    "pydantic-ai-slim[openai]>=0.8.1",
    "pyttsx3>=2.99",
    "sounddevice>=0.5.6",
    "speechrecognition>=3.17.0",
]

[project.scripts]
start = "local_voice_assistant:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
